    <title>CASAFAMI — Cabinet médical</title>
    <style>
      /* Préchargeur : visible dès le premier affichage, retiré par main.jsx quand le site est prêt. */
      #precharge { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: linear-gradient(160deg, #0a8fc7, #07688f); color: #fff; font-family: Lato, system-ui, sans-serif; transition: opacity .5s ease, visibility .5s ease; }
      #precharge.precharge-fin { opacity: 0; visibility: hidden; }
      #precharge .logo { position: relative; width: 112px; height: 112px; display: grid; place-items: center; }
      #precharge .logo::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; animation: precharge-tour 1s linear infinite; }
      #precharge .logo img { width: 80px; height: 80px; object-fit: contain; background: #fff; border-radius: 22px; padding: 8px; animation: precharge-bat 1.6s ease-in-out infinite; }
      #precharge .nom { font-family: Montserrat, Lato, sans-serif; font-weight: 800; font-size: 1.15rem; letter-spacing: .38em; text-transform: uppercase; margin-right: -.38em; }
      #precharge .sous { margin-top: -14px; font-size: .8rem; letter-spacing: .12em; opacity: .8; }
      #precharge .barre { width: 150px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; }
      #precharge .barre::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: #fff; animation: precharge-barre 1.3s ease-in-out infinite; }
      @keyframes precharge-tour { to { transform: rotate(360deg); } }
      @keyframes precharge-bat { 0%, 100% { transform: scale(1); } 50% { transform: scale(.93); } }
      @keyframes precharge-barre { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        #precharge .logo::before, #precharge .logo img, #precharge .barre::after { animation: none; }
        #precharge { transition: none; }
      }
    </style>
    <noscript><style>#precharge { display: none; }</style></noscript>
  </head>
  <body>
    <div id="precharge" role="status" aria-label="Chargement du site">
      <div class="logo"><img src="/logo_casafami.png" alt="" width="80" height="80" /></div>
      <div class="nom">casafami</div>
      <div class="sous">Cabinet d'accouchement</div>
      <div class="barre" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
